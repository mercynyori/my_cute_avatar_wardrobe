<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Cute Wardrobe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>

<body>
<header>
  <h1>🎀 My cute wardrobe</h1>
  <div class="play">
    <button data-p="wave">Wave 👋</button><button data-p="dance">Dance 💃</button>
    <button data-p="jump">Jump ✨</button><button data-p="spin">Twirl 🌀</button><button data-p="confetti">Confetti 🎉</button>
    <button id="music">Music 🎵</button><label class="btn">Your song 📁<input id="song" type="file" accept="audio/*"></label>
    <button id="undress">Reset</button>
  </div>
</header>

<main>
<div id="stage">
<svg id="me" viewBox="0 0 400 600" aria-label="Avatar. Tap to make her jump.">
 <ellipse cx="200" cy="575" rx="95" ry="12" fill="#6b2742" opacity=".15"/>
 <g id="av">
  <path d="M118 128 L128 66 L174 104Z M282 128 L272 66 L226 104Z" fill="#8a4560"/>
  <path d="M128 100 L132 82 L156 102Z M272 100 L268 82 L244 102Z" fill="#ffb3cc"/>
  <ellipse cx="200" cy="205" rx="104" ry="96" fill="#8a4560"/>
  <circle cx="100" cy="250" r="30" fill="#8a4560"/><circle cx="300" cy="250" r="30" fill="#8a4560"/>
  <rect x="172" y="395" width="24" height="98" rx="12" fill="#ffdcc8"/><rect x="204" y="395" width="24" height="98" rx="12" fill="#ffdcc8"/>
  <ellipse cx="184" cy="497" rx="17" ry="9" fill="#ffdcc8"/><ellipse cx="216" cy="497" rx="17" ry="9" fill="#ffdcc8"/>
  <rect x="150" y="296" width="22" height="82" rx="11" fill="#ffdcc8" transform="rotate(10 161 306)"/>
  <g id="aR"><rect x="228" y="296" width="22" height="82" rx="11" fill="#ffdcc8" transform="rotate(-10 239 306)"/></g>
  <rect x="188" y="268" width="24" height="30" fill="#ffdcc8"/>
  <rect x="158" y="288" width="84" height="112" rx="36" fill="#fff4f8"/>
  <g id="L-shoes"></g><g id="L-bottoms"></g><g id="L-tops"></g><g id="L-dresses"></g><g id="L-mine"></g>
  <ellipse cx="200" cy="190" rx="96" ry="88" fill="#ffdcc8"/>
  <path d="M104 182 Q108 100 200 98 Q292 100 296 182 Q272 142 246 152 Q222 118 200 152 Q178 118 154 152 Q128 142 104 182Z" fill="#8a4560"/>
  <g id="eyes"><ellipse cx="160" cy="203" rx="15" ry="19" fill="#3d1a2c"/><ellipse cx="240" cy="203" rx="15" ry="19" fill="#3d1a2c"/>
   <circle cx="166" cy="195" r="6" fill="#fff"/><circle cx="246" cy="195" r="6" fill="#fff"/><circle cx="155" cy="210" r="3" fill="#fff"/><circle cx="235" cy="210" r="3" fill="#fff"/></g>
  <ellipse cx="128" cy="228" rx="15" ry="9" fill="#ff7fa8" opacity=".55"/><ellipse cx="272" cy="228" rx="15" ry="9" fill="#ff7fa8" opacity=".55"/>
  <path d="M187 230 Q200 242 213 230" stroke="#c4506f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <g id="L-extras"></g><g id="L-hats"></g>
 </g>
</svg>
</div>
</main>


<div id="panel">
  <div class="row" id="tabs"></div>
  <div class="row" id="items"></div>
  <div class="row" id="sw"></div>
  <p class="hint" id="hint">Tap a piece to wear it, tap again to take it off. Pick a colour to make it yours.</p>
</div>


<script src="script.js"></script>
</body>
</html>
